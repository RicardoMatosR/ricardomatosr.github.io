<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Ricardo Matos</title>
    <!-- Tus fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #050706;
            --accent: #00ffc3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 30%, rgba(0, 255, 195, 0.045) 0%, transparent 75%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-family: 'Fira Code', monospace;
            font-size: clamp(6rem, 15vw, 10rem);
            margin: 0;
            font-weight: 900;
            letter-spacing: -5px;
            color: var(--accent);
            text-shadow: 0px 0px 20px rgba(0, 255, 195, 0.2);
            line-height: 1;
        }

        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 10px;
            color: #ccc;
        }

        p {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #666;
            margin-top: 20px;
        }

        #contador {
            color: var(--accent);
            font-weight: bold;
        }

        .btn-volver {
            margin-top: 40px;
            padding: 12px 24px;
            background-color: transparent;
            color: var(--accent);
            text-decoration: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            border: 1px solid var(--accent);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-volver:hover {
            background-color: rgba(0, 255, 195, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 195, 0.2);
        }
    </style>
</head>

<body>

    <h1>404</h1>
    <h2>System Exception_</h2>
    <p>> La ruta solicitada no existe o ha sido movida.<br>
        > Rebooting system in <span id="contador">5</span>s...</p>

    <a href="https://ricardomatosr.github.io/" class="btn-volver">return to_home;</a>

    <script>
        let segundosRestantes = 5;
        const elementoContador = document.getElementById('contador');

        const cuentaAtras = setInterval(function () {
            segundosRestantes--;
            elementoContador.textContent = segundosRestantes;

            if (segundosRestantes <= 0) {
                clearInterval(cuentaAtras);
                window.location.href = "https://ricardomatosr.github.io/";
            }
        }, 1000);
    </script>
</body>

</html>
